server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    connection-timeout: 300000

spring:
  application:
    name: health-butler
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd
    time-zone: Asia/Shanghai
    mapper:
      default-view-inclusion: false
  datasource:
    url: jdbc:mysql://localhost:3306/health_butler?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: your_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
  cache:
    type: simple

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Kimi API 配置 (OpenAI 兼容接口)
# kimi-k2.5 原生多模态，32B 活跃参数，比 k2.6 更快
ai:
  api:
    key: your_api_key  # 填你的 Kimi API Key
    url: https://api.moonshot.cn/v1
  model:
    vision: kimi-k2.5
    text: kimi-k2.5

# JWT配置
jwt:
  secret: your_jwt_secret_key_at_least_256_bits_long_for_hs256_algorithm
  expiration: 86400
